<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
 <title>Protatodex</title>
 <style>
   :root {
     --bg-dark: #0a0d14;
     --card-bg: rgba(22, 28, 45, 0.65);
     --card-border: rgba(255, 255, 255, 0.1);
     --accent-green: #38ef7d;
     --accent-blue: #11998e;
     --text-main: #f0f4f8;
     --text-muted: #94a3b8;
   }

   * {
     box-sizing: border-box;
     margin: 0;
     padding: 0;
     font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
   }

   body {
     background: var(--bg-dark);
     color: var(--text-main);
     min-height: 100vh;
     padding: clamp(12px, 3vw, 24px);
     background-image:
       radial-gradient(circle at 10% 10%, rgba(56, 239, 125, 0.05) 0%, transparent 40%),
       radial-gradient(circle at 90% 90%, rgba(17, 153, 142, 0.05) 0%, transparent 40%);
     background-attachment: fixed;
     overflow-x: hidden;
   }

   .container {
     max-width: 1000px;
     margin: 0 auto;
     width: 100%;
   }

   header {
     text-align: center;
     margin-bottom: 20px;
   }

   h1 {
     font-size: clamp(1.8rem, 5vw, 2.8rem);
     background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
     -webkit-background-clip: text;
     -webkit-text-fill-color: transparent;
     margin-bottom: 8px;
   }

   p.subtitle {
     color: var(--text-muted);
     font-size: clamp(0.85rem, 2.5vw, 1rem);
   }

   /* Controls Panel */
   .controls {
     background: var(--card-bg);
     backdrop-filter: blur(12px);
     -webkit-backdrop-filter: blur(12px);
     border: 1px solid var(--card-border);
     border-radius: 16px;
     padding: clamp(12px, 2.5vw, 20px);
     margin-bottom: 24px;
     display: flex;
     flex-direction: column;
     gap: 12px;
     box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
   }

   .search-sort {
     display: flex;
     gap: 10px;
     flex-wrap: wrap;
   }

   input[type="text"], select {
     background: rgba(0, 0, 0, 0.4);
     border: 1px solid var(--card-border);
     color: var(--text-main);
     padding: 12px 16px;
     border-radius: 10px;
     font-size: 0.95rem;
     outline: none;
     transition: border-color 0.2s;
   }

   input[type="text"] {
     flex: 1 1 200px;
   }

   select {
     flex: 0 1 150px;
     cursor: pointer;
   }

   input[type="text"]:focus, select:focus {
     border-color: var(--accent-green);
   }

   .tag-filters {
     display: flex;
     flex-wrap: wrap;
     gap: 8px;
   }

   .filter-chip {
     background: rgba(255, 255, 255, 0.05);
     border: 1px solid var(--card-border);
     color: var(--text-muted);
     padding: 6px 14px;
     border-radius: 20px;
     font-size: 0.8rem;
     cursor: pointer;
     user-select: none;
     transition: all 0.2s ease;
   }

   .filter-chip.active {
     background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
     color: #000;
     font-weight: 600;
     border-color: transparent;
   }

   /* Cards Grid */
   .grid {
     display: flex;
     flex-direction: column;
     gap: 16px;
   }

   .card {
     background: var(--card-bg);
     backdrop-filter: blur(10px);
     -webkit-backdrop-filter: blur(10px);
     border: 1px solid var(--card-border);
     border-radius: 16px;
     overflow: hidden;
     transition: transform 0.2s ease, border-color 0.2s ease;
   }

   .card-header {
     padding: clamp(14px, 3vw, 18px);
     display: flex;
     justify-content: space-between;
     align-items: center;
     cursor: pointer;
     background: rgba(255, 255, 255, 0.02);
   }

   .card-title {
     font-size: clamp(1.1rem, 3.5vw, 1.4rem);
     font-weight: 700;
     color: var(--text-main);
     display: flex;
     align-items: center;
     gap: 10px;
   }

   .row-badge {
     font-size: 0.75rem;
     background: rgba(255, 255, 255, 0.1);
     padding: 2px 8px;
     border-radius: 6px;
     color: var(--text-muted);
   }

   .toggle-icon {
     font-size: 1.2rem;
     transition: transform 0.3s ease;
   }

   .card.open .toggle-icon {
     transform: rotate(180deg);
   }

   .card-body {
     max-height: 0;
     overflow: hidden;
     transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
     padding: 0 clamp(14px, 3vw, 18px);
   }

   .card.open .card-body {
     max-height: 3000px;
     padding: 0 clamp(14px, 3vw, 18px) clamp(14px, 3vw, 18px);
     transition: max-height 0.4s cubic-bezier(1, 0, 1, 0);
   }

   .build-list {
     display: flex;
     flex-direction: column;
     gap: 14px;
     margin-top: 10px;
   }

   .build-item {
     background: rgba(0, 0, 0, 0.3);
     border: 1px solid rgba(255, 255, 255, 0.05);
     border-radius: 12px;
     padding: 12px 14px;
   }

   .build-header {
     display: flex;
     justify-content: space-between;
     align-items: flex-start;
     flex-wrap: wrap;
     gap: 8px;
     margin-bottom: 6px;
   }

   .build-name {
     font-weight: 600;
     font-size: 0.95rem;
     color: var(--accent-green);
   }

   .build-tags {
     display: flex;
     flex-wrap: wrap;
     gap: 4px;
   }

   .tag-pill {
     font-size: 0.7rem;
     padding: 2px 8px;
     border-radius: 10px;
     background: rgba(56, 239, 125, 0.15);
     color: var(--accent-green);
     border: 1px solid rgba(56, 239, 125, 0.3);
   }

   .build-desc {
     font-size: 0.85rem;
     color: #cbd5e1;
     line-height: 1.4;
     margin-bottom: 8px;
   }

   .build-meta {
     display: flex;
     gap: 12px;
     flex-wrap: wrap;
     font-size: 0.78rem;
   }

   .meta-box {
     background: rgba(255, 255, 255, 0.03);
     padding: 4px 8px;
     border-radius: 6px;
   }

   .meta-box.bans {
     color: #fca5a5;
   }

   .meta-box.unlocks {
     color: #fde047;
   }

   @media (max-width: 600px) {
     .controls {
       padding: 12px;
     }
     .build-header {
       flex-direction: column;
     }
   }
 </style>
</head>

         { name: "6x Medical Guns (Overheal Turtle)", tags: ["Life Steal"], desc: "Provides reliable baseline healing to guarantee a clean, zero-Curse victory.", bans: "All Cursed Items, Melee Damage", unlocks: "Medical Gun" }
       ]
     }
   ];

   let currentSelectedTag = "ALL";

   function renderCards() {
     const grid = document.getElementById("characterGrid");
     const query = document.getElementById("searchInput").value.toLowerCase();
     const sort = document.getElementById("sortSelect").value;

     grid.innerHTML = "";

     let list = [...characterData];

     if (sort === "name") {
       list.sort((a, b) => a.name.localeCompare(b.name));
     }

     list.forEach((char) => {
       const matchingBuilds = char.builds.filter((build) => {
         const matchesTag = currentSelectedTag === "ALL" || build.tags.includes(currentSelectedTag);
         const matchesSearch = query === "" ||
           char.name.toLowerCase().includes(query) ||
           build.name.toLowerCase().includes(query) ||
           build.desc.toLowerCase().includes(query) ||
           build.tags.some(t => t.toLowerCase().includes(query));
         return matchesTag && matchesSearch;
       });

       if (matchingBuilds.length === 0) return;

       const card = document.createElement("div");
       card.className = "card";

       let buildsHTML = matchingBuilds.map(b => `
         <div class="build-item">
           <div class="build-header">
             <span class="build-name">${b.name}</span>
             <div class="build-tags">
               ${b.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
             </div>
           </div>
           <p class="build-desc">${b.desc}</p>
           <div class="build-meta">
             <span class="meta-box bans"><strong>Bans:</strong> ${b.bans}</span>
             <span class="meta-box unlocks"><strong>Unlock:</strong> ${b.unlocks}</span>
           </div>
         </div>
       `).join('');

       card.innerHTML = `
         <div class="card-header">
           <div class="card-title">
             <span>${char.name}</span>
             <span class="row-badge">${char.row}</span>
           </div>
           <span class="toggle-icon">▼</span>
         </div>
         <div class="card-body">
           <div class="build-list">
             ${buildsHTML}
           </div>
         </div>
       `;

       card.querySelector('.card-header').addEventListener('click', () => {
         card.classList.toggle('open');
       });

       grid.appendChild(card);
     });
   }

   document.getElementById("searchInput").addEventListener("input", renderCards);
   document.getElementById("sortSelect").addEventListener("change", renderCards);

   document.getElementById("tagFilters").addEventListener("click", (e) => {
     if (e.target.classList.contains("filter-chip")) {
       document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
       e.target.classList.add("active");
       currentSelectedTag = e.target.getAttribute("data-tag");
       renderCards();
     }
   });

   renderCards();
 </script>
</body>
</html>
